# `dsh-extension-cdp` — attach the DSH Chrome DevTools MCP client to the Edge the user is
# already running (daily profile, remote debugging enabled from edge://inspect).
# Toggle this row in Settings -> Plugins, or with `plugin_manager set_plugin`.
# Why a wrapper: the DevToolsActivePort handshake path (`<user data>/DevToolsActivePort`)
# rewrites its GUID every time the switch is flipped, so the endpoint must be
# re-read on every spawn (lib/endpoint.mjs, connect.mjs).
- insert:
    - id: dsh-extension-cdp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        # 与 DSH 官方 browser-use bundle 同名：工具前缀统一成 mcp__chrome-devtools-mcp__*。
        serverName: chrome-devtools-mcp
        command: !!js process.execPath
        args:
          # Do not hardcode a local path here. This row's `baseUrl` is the
          # *profile* directory (the root include anchors baseUrl there), so
          # resolve our own entry through the profile's node_modules instead.
          # The official dsh-web-app bundle uses the same idiom (the
          # skill-filesystem row resolves a package-relative path this way).
          - !!js process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-extension-cdp/connect.mjs')
          - '--no-usage-statistics'
          - '--categoryExtensions'
          # No --workspace here on purpose: it is a per-machine path. Give the row a
          # directory by adding ['--workspace', '<dir>'] to this args list, or via the
          # forwarded DSH_CDP_WORKSPACES env below (connect.mjs turns each entry into
          # one --workspace flag; repeatable, path.delimiter-separated) -- and the
          # easiest way is the GUI: Plugins -> this row -> "配置" writes that env.
          # Why it matters: chrome-devtools-mcp >= 1.6 restricts every file-writing
          # tool (take_screenshot / upload_file / install_extension / trace export) to
          # the MCP client's roots + these workspace dirs + the OS temp dir. DSH's MCP
          # client never negotiates roots, so without this the OS temp dir is the only
          # place a screenshot can be saved; somewhere like the Desktop is refused with
          # "is not within any of the configured workspace roots". The dir must exist
          # (roots are realpath'd); reload/list/evaluate never needed it.
        # The endpoint is expected to be absent while the Edge switch is off:
        # do not fail activation, let the reconnect policy below keep retrying
        # so flipping the switch later connects on its own.
        failOnStartupError: false
        # The MCP client allows 60 s per tools/call by default. In approval mode the
        # first call is the one waiting for the human to click "Allow remote
        # debugging?" in Edge, and 60 s is too short to go find that dialog -- the
        # call then fails and the click was wasted. 5 minutes; a genuinely stuck
        # call is still cancellable like any other tool call.
        toolCallTimeoutMs: 300000
        # The MCP client hands the child a scrubbed environment: every DSH_* name
        # is dropped, so DSH_PROFILE_DIR never reaches connect.mjs on its own.
        # Explicit `env` merges after that scrub, so forward the Host-side value
        # here; connect.mjs falls back to scanning <dsh home>/profiles/* anyway.
        env:
          DSH_CDP_MCP_SEARCH_DIRS: !!js process.env.DSH_PROFILE_DIR || ''
          # Same treatment for the workspace list: the MCP client's env scrub drops
          # every DSH_* name (including this one), so forward it explicitly. Empty
          # string = no extra workspace root (temp dir remains the only one).
          # The GUI configuration page writes this exact key (see the row below).
          DSH_CDP_WORKSPACES: !!js process.env.DSH_CDP_WORKSPACES || ''
        reconnect:
          maxAttempts: 1000
          maxDelayMs: 30000
    # Client 半侧（插件页里那个"配置"页）必须挂在一个模块名等于包名的 Loader 行上：
    # dsh-client-modules 只认这种行。它把配置页注册到 plugins.row.config 的
    # `dsh-extension-cdp#dsh-extension-cdp`（上面 MCP 那一行的 id），所以
    # 侧栏 插件 → dsh-extension-cdp → MCP 那一行 会多出一个"配置"控件，
    # 页面读写走本包 index.js 的 /api/dsh-extension-cdp/workspaces/*。
    # 这一行本身没有 config：白名单写在上面那一行的 env 里（connect.mjs 只读那里）。
    - id: dsh-extension-cdp-ui
      name: dsh-extension-cdp
